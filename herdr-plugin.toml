# herdr-ios-simulator: an iOS Simulator in a herdr pane (the View). Agents drive it with the
# `herdr-ios` CLI (simctl for devices, apps and logs; AXe for touch and video).

id = "herdr-ios-simulator"
name = "herdr-ios-simulator"
version = "1.0.0" # x-release-please-version
description = "An iOS Simulator beside your coding agent: a live view you can tap, and a CLI for agents to build, run, drive and read the app's logs and crashes."
min_herdr_version = "0.9.0"
platforms = ["macos"]

[[build]]
command = ["cargo", "build", "--release"]

# Set up straight away on install and update, rather than at herdr's next start. Non-fatal: a
# failed build step aborts the install, and the startup hooks below retry the first two.
[[build]]
command = ["/bin/sh", "-c", "./target/release/herdr-ios install-cli || true"]

[[build]]
command = ["/bin/sh", "-c", "./target/release/herdr-ios install-desktop --if-present || true"]

# Teach Claude Code, Codex, OpenCode and Pi to use herdr-ios (only those whose home folder exists).
[[build]]
command = ["/bin/sh", "-c", "./target/release/herdr-ios install-agents || true"]

# Put `herdr-ios` on PATH (~/.local/bin) so agents can call it; replaces its own symlink.
[[startup]]
command = ["./target/release/herdr-ios", "install-cli"]

# If herdr desktop is installed, keep its + menu entry and menu pointing at this build.
[[startup]]
command = ["./target/release/herdr-ios", "install-desktop", "--if-present"]

[[panes]]
id = "simulator"
title = "Simulator"
placement = "split"
command = ["./target/release/herdr-ios", "pane"]

[[actions]]
id = "open"
title = "Simulator: open"
description = "Boot the simulator if needed and show it in a pane."
command = ["/bin/sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin herdr-ios-simulator --entrypoint simulator"]

[[actions]]
id = "shutdown"
title = "Simulator: shut down"
description = "Shut the current simulator down."
command = ["./target/release/herdr-ios", "shutdown"]

[[actions]]
id = "send-screenshot"
title = "Simulator: send screenshot to agent"
description = "Screenshot the simulator and send its file path to an agent."
command = ["./target/release/herdr-ios", "send", "screenshot"]

[[actions]]
id = "send-errors"
title = "Simulator: send errors to agent"
description = "Send the app's errors and crashes from the last 5 minutes to an agent."
command = ["./target/release/herdr-ios", "send", "errors"]

[[actions]]
id = "install-agents"
title = "Simulator: set up agents"
description = "Teach Claude Code, Codex, OpenCode and Pi to use herdr-ios for iOS apps, in every project."
command = ["./target/release/herdr-ios", "install-agents"]

[[actions]]
id = "install-desktop"
title = "Simulator: add to herdr desktop's + menu"
description = "Add iOS Simulator to herdr desktop's + menu."
command = ["./target/release/herdr-ios", "install-desktop"]

[[actions]]
id = "install-cli"
title = "Simulator: install CLI"
description = "Symlink herdr-ios into ~/.local/bin so agents can call it."
command = ["./target/release/herdr-ios", "install-cli"]
