[package]
name = "herdr-ios-simulator"
version = "0.1.0"
edition = "2024"
description = "An iOS Simulator in a herdr pane: a live view for you, and a CLI for agents to drive it and read its logs."
license = "MIT"
repository = "https://github.com/MattJColes/herdr-ios-simulator"

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
zune-jpeg = "0.5"

[[bin]]
name = "herdr-ios"
path = "src/main.rs"

[profile.release]
strip = true
